[phases.setup]
nixPkgs = ["php84", "nodejs"]

[variables]
NIXPACKS_PHP_VERSION = "8.4"

[phases.install]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install"
]

[phases.build]
cmds = [
  "npm run build"
]

[start]
cmd = "php artisan migrate --force && php artisan serve --host=0.0.0.0 --port=$PORT"